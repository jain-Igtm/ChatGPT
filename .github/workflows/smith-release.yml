name: Build Permanent Smith APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0" >/dev/null

      - name: Prepare permanent signing key
        env:
          SMITH_KEYSTORE_B64: ${{ secrets.SMITH_KEYSTORE_B64 }}
          SMITH_KEYSTORE_PASSWORD: ${{ secrets.SMITH_KEYSTORE_PASSWORD }}
          SMITH_KEY_ALIAS: ${{ secrets.SMITH_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SMITH_KEYSTORE_B64" || { echo "Missing SMITH_KEYSTORE_B64"; exit 1; }
          test -n "$SMITH_KEYSTORE_PASSWORD" || { echo "Missing SMITH_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SMITH_KEY_ALIAS" || { echo "Missing SMITH_KEY_ALIAS"; exit 1; }
          printf '%s' "$SMITH_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/smith-release.jks"

      - name: Test
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble permanently signed APK
        env:
          SMITH_KEYSTORE_PATH: ${{ runner.temp }}/smith-release.jks
          SMITH_KEYSTORE_PASSWORD: ${{ secrets.SMITH_KEYSTORE_PASSWORD }}
          SMITH_KEY_ALIAS: ${{ secrets.SMITH_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload permanent Smith APK
        uses: actions/upload-artifact@v4
        with:
          name: smith-permanent-release
          path: android-agent/app/build/outputs/apk/release/app-release.apk
