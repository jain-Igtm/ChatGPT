name: Resident Agent Android

on:
  pull_request:
    paths:
      - "android-agent/**"
      - ".github/workflows/resident-agent-android.yml"
  push:
    branches: [main]
    paths:
      - "android-agent/**"
      - ".github/workflows/resident-agent-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0" >/dev/null

      - name: Test
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resident-agent-debug
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
